<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
</head>
<body>
    <h1>table</h1>
    <table border="3">
        <tr>
            <th>S No</th>
            <th>item</th>
            <th>price</th>
            <th>action</th>
        </tr>
        <tr>
            <td>1</td>
            <td>apple</td>
            <td>$3.55</td>
            <td>delete</td>
        </tr>
        <tr>
            <td>2</td>
            <td>banana</td>
            <td>$3.55</td>
            <td>delete</td>
        </tr>
        <tr>
            <td>3</td>
            <td>watermelon</td>
            <td colspan="2">$3.55</td>
        </tr>
        <tr>
            <td>4</td>
            <td>guaua</td>
            <td rowspan="2">$5.66</td>
            <td>install</td>
        </tr>
        <tr>
            <td>5</td>
            <td>cold guaua</td>
            <td>install</td>
        </tr>
    </table>
    
</body>
</html>
