<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text formating</title>
</head>
<body>
    <h1>bold</h1>
    <p>i am a good <b>boy</b></p>

    <h2>italic</h2>
    <p>i am a good <i>boy</i></p>

    <h2>underline</h2>
    <p>i am a good <u>boy</u></p>

    <h2>strikethrough</h2>
    <p>i am a <s>girl</s> boy</p>

    <h2>subtag</h2>
    <p>h<sub>2</sub>o</p>
    <p>h <sub>2</sub> o</p>

    <h2>supertag</h2>
    <p>2<sup>n</sup></p>

    <h2>combine formating</h2>
    <p>i am a <b><i>boy and god</i></b></p>
</body>
</html>
