<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            width: 80vw;
            height: 50vh;
            /* height: auto; */
            /* padding: 18px; */
            border: 5px solid red;
            display: flex;
            /* flex-direction: column;  */
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            /* flex-wrap: wrap; */
            gap: 15px;
        }
        .box{
            /* width: 48px; */
            height: 80px;
            border: 2px solid rgb(13, 85, 3);
            /* padding: 10px; */
            /* margin: 8px; */
            /* flex-grow: 1; */
            flex-shrink: 1;
            flex-basis: 102px;

        }
        #box1{
            /* align-self: flex-start; */
            /* flex-grow: 3; */
            flex-shrink: 3;
           
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
    </div>
    
</body>
</html>
