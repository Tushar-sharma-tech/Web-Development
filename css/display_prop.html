<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        div {
            background-color: red;
           
        }

        span {
            background-color: yellow;
            border: 2px rgb(65, 150, 78) solid;
            display: inline-block;
            width: 45px;
            
        }
    </style>
</head>

<body>
    <h1>Display properties</h1>
    <!-- block element- takes entier width -->
    <div>
        i am a div
    </div>

    <!-- inline element take only required width by content -->
    <span>i am span1</span>
    <span>i am span2</span>

</body>

</html>
