<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colours</title>
    <style>
        div{
            /* named colour */
            color: red;
            /* hex code */
            background-color: #000000;
        }
        p{
            /* rgb */
            color: rgb(13, 0, 255);

            /* rgba */
            background-color: rgba(255, 0, 0, 0.3);
        }
        h1{
            /* hsl */
            color: hsl(77, 59%, 13%);
             background-color: hsla(120, 60%, 70%, 0.3);
              border: 2px solid #333;
        }
    
    </style>
</head>
<body>
    <h1>NOW I DONT KNOW WHAT TO WRITE</h1>
    <div>
        THIS IS ALL ABOUT COLOURS , THAT MAKES THINGS BEAUTIFUL
    </div>
    <p>THE COLOURS MATTER</p>
    
</body>
</html>
