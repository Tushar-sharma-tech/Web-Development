<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin & padding</title>
    <style>
        h1{
            border: 2px solid red;
            background-color: aqua;
            padding: 23px;
            width: 500px;
            margin: auto;
        }

        p{
            border: 3px solid green;
            background-color: beige;
            padding: 23px;
            margin: 23px;
        }
    </style>
</head>
<body>
    <h1>margin collapse</h1>
    <p>this is an paragraf</p>
    <p>this is another paragraf</p>
    <p>this is yet another paragraf</p>
    
</body>
</html>
