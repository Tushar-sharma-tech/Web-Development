<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>
    <style>
        .container{
            background-color: red;
        }
        .box{
            background-color: greenyellow;
            margin: 3px;
            width: 45px;
            height: 45px;
            /* transition: width 0.5s ease-out 3s; */
            animation: slide 3s ease 2s 5 reverse backwards;
        }
        @keyframes slide {
            from{
                width: 45px;
            }
            to{
                width: 45vw;
            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
    </div>
    
</body>
</html>
